name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FoodLedger.slnx

      - name: Build
        run: dotnet build FoodLedger.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FoodLedger.Tests/FoodLedger.Tests.csproj --configuration Release --no-build

      - name: Validate Docker Compose
        run: docker compose config --quiet
        env:
          POSTGRES_DB: Foodledger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          FOODLEDGER_API_HTTP_PORT: 5062
          ASPNETCORE_ENVIRONMENT: Production
          FOODLEDGER_CORS_ALLOWED_ORIGIN: http://localhost:8180
          FOODLEDGER_APPLY_MIGRATIONS_ON_STARTUP: true

      - name: Build Docker image
        run: docker build -f FoodLedger/Dockerfile -t foodledger-api:test .
